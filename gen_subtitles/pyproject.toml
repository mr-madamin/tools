[project]
name = "gen-subtitles"
version = "0.1.0"
description = "Generate .srt subtitles from video files, in any language"
readme = "README.md"
authors = [
    { name = "Daler", email = "8993696+mr-madamin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
subtitle = "gen_subtitles.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
